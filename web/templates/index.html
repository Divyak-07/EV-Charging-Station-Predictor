<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Charging Station Predictor | AI-Powered Site Analysis</title>
    <meta name="description" content="Interactive ML-powered dashboard for predicting optimal EV charging station locations using OpenStreetMap data.">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- App CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Header -->
    <header id="app-header">
        <div class="header-left">
            <div class="logo-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
                </svg>
            </div>
            <h1>EV Station Predictor</h1>
            <span class="badge" id="model-badge">Loading...</span>
        </div>
        <div class="header-right">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text">Connecting...</span>
        </div>
    </header>

    <!-- Main Layout -->
    <div id="app-container">
        <!-- Sidebar -->
        <aside id="sidebar">
            <!-- Upload Panel -->
            <div class="panel" id="upload-panel">
                <h2 class="panel-title">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                    Upload Map
                </h2>
                <div id="dropzone" class="dropzone">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.5">
                        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                    </svg>
                    <p>Drop <strong>.osm</strong> file here</p>
                    <span class="dropzone-hint">or click to browse</span>
                    <input type="file" id="file-input" accept=".osm" hidden>
                </div>
                <div class="divider-text">OR</div>
                <button id="btn-draw" class="btn btn-outline">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                    </svg>
                    Draw on Map
                </button>
            </div>

            <!-- Controls Panel -->
            <div class="panel" id="controls-panel" style="display:none;">
                <h2 class="panel-title">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
                    </svg>
                    Layers & Filters
                </h2>

                <div class="control-group">
                    <label class="toggle-label">
                        <input type="checkbox" id="toggle-heatmap" checked>
                        <span class="toggle-slider"></span>
                        Suitability Heatmap
                    </label>
                    <label class="toggle-label">
                        <input type="checkbox" id="toggle-candidates" checked>
                        <span class="toggle-slider"></span>
                        Top Candidates
                    </label>
                    <label class="toggle-label">
                        <input type="checkbox" id="toggle-roads" checked>
                        <span class="toggle-slider"></span>
                        Road Overlay
                    </label>
                </div>

                <div class="control-group">
                    <label class="slider-label">
                        Min Score: <strong id="score-value">0.00</strong>
                    </label>
                    <input type="range" id="score-filter" min="0" max="100" value="0" class="score-slider">
                </div>

                <button id="btn-reset" class="btn btn-outline btn-small">
                    Reset Map
                </button>
            </div>

            <!-- Results Panel -->
            <div class="panel" id="results-panel" style="display:none;">
                <h2 class="panel-title">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                    </svg>
                    Results
                </h2>
                <div id="stats-grid" class="stats-grid"></div>
                <div id="candidates-list" class="candidates-list"></div>
            </div>
        </aside>

        <!-- Map -->
        <main id="map-container">
            <div id="map"></div>
            <!-- Loading overlay -->
            <div id="loading-overlay" style="display:none;">
                <div class="loader">
                    <div class="loader-spinner"></div>
                    <p id="loading-text">Analyzing map...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
